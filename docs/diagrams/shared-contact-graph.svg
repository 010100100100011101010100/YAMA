<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">A bounded FalkorDB subgraph: four synthetic cases share one phone</title>
  <desc id="desc">Catalogue cases 01 laptop, 02 camera, 03 tablet, and 26 portfolio takeover each have a HAS_IDENTIFIER edge to phone:+12025550101. Case 01 also has a HAS_DISCOVERY_DETAIL edge to amount:18400; case 26 has one to reported_alias:lex voss. These edges demonstrate candidate retrieval, not a common operator. Authored actor answer-key edges are excluded from runtime retrieval. Based on the recorded cloud SDK verification and fictional catalogue, not a live graph view.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#9cdda9"/></marker>
    <marker id="weak-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#d8bb87"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#eef5ef;font-size:20px}
      .title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.label{font-size:16px;letter-spacing:1px;fill:#b4c5b9}.muted{fill:#b4c5b9;font-size:18px}.green{fill:#b5ebbf}.weak{fill:#ecd3a9}.case{fill:#19241e;stroke:#526c5b;stroke-width:1.5}.edge{fill:none;stroke:#9cdda9;stroke-width:2;marker-end:url(#arrow)}.weak-edge{fill:none;stroke:#d8bb87;stroke-width:2;marker-end:url(#weak-arrow)}
    </style>
  </defs>
  <rect width="1120" height="800" rx="20" fill="#101813"/>
  <text x="40" y="52" class="title">One phone. Four reports. A lead to review.</text>
  <text x="40" y="84" class="muted">Published fictional catalogue · recorded cloud SDK check · bounded subgraph</text>
  <path d="M275 254V272H450V322" class="edge"/>
  <path d="M845 254V272H670V322" class="edge"/>
  <path d="M275 470V450H450V408" class="edge"/>
  <path d="M845 470V450H670V408" class="edge"/>
  <path d="M90 254V266H22V655H38" class="weak-edge"/>
  <path d="M985 596V616" class="weak-edge"/>
  <rect x="40" y="130" width="470" height="124" rx="12" class="case"/>
  <text x="60" y="160" class="label">CATALOGUECASE / 01</text>
  <text x="60" y="194" class="head">Two shipping labels, no laptop</text>
  <text x="60" y="226" class="muted">INR18,400 paid · full recovery reported</text>
  <rect x="610" y="130" width="470" height="124" rx="12" class="case"/>
  <text x="630" y="160" class="label">CATALOGUECASE / 02</text>
  <text x="630" y="194" class="head">A camera deposit</text>
  <text x="630" y="226" class="muted">INR7,200 paid · no recovery reported</text>
  <rect x="347" y="322" width="426" height="86" rx="43" fill="#1c3826" stroke="#9cdda9" stroke-width="2"/>
  <text x="560" y="351" text-anchor="middle" class="label green">IDENTIFIER</text>
  <text x="560" y="382" text-anchor="middle" class="head green">phone:+12025550101</text>
  <text x="275" y="303" text-anchor="middle" class="label green">HAS_IDENTIFIER</text>
  <text x="845" y="303" text-anchor="middle" class="label green">HAS_IDENTIFIER</text>
  <text x="275" y="437" text-anchor="middle" class="label green">HAS_IDENTIFIER</text>
  <text x="845" y="437" text-anchor="middle" class="label green">HAS_IDENTIFIER</text>
  <rect x="40" y="470" width="470" height="126" rx="12" class="case"/>
  <text x="60" y="500" class="label">CATALOGUECASE / 03</text>
  <text x="60" y="534" class="head">The drawing tablet</text>
  <text x="60" y="567" class="muted">INR9,600 paid · partial recovery reported</text>
  <rect x="610" y="470" width="470" height="126" rx="12" class="case"/>
  <text x="630" y="500" class="label">CATALOGUECASE / 26</text>
  <text x="630" y="534" class="head">A compromised portfolio account</text>
  <text x="630" y="567" class="muted">Repair support · account access still lost</text>
  <rect x="40" y="616" width="470" height="78" rx="12" fill="#2b241b" stroke="#b99d70"/>
  <text x="60" y="645" class="label weak">DISCOVERYDETAIL / WEAK HINT</text>
  <text x="60" y="676" class="head weak">amount:18400</text>
  <rect x="610" y="616" width="470" height="78" rx="12" fill="#2b241b" stroke="#b99d70"/>
  <text x="630" y="645" class="label weak">DISCOVERYDETAIL / WEAK HINT</text>
  <text x="630" y="676" class="head weak">reported_alias:lex voss</text>
  <rect x="46" y="356" width="196" height="46" rx="6" fill="#101813"/>
  <text x="57" y="374" class="label weak">HAS_DISCOVERY_</text>
  <text x="57" y="395" class="label weak">DETAIL (case 01)</text>
  <text x="610" y="718" class="muted">Amber keys use HAS_DISCOVERY_DETAIL.</text>
  <text x="40" y="752" class="muted">Edges retrieve candidates. The current agent reviews their relevance before attaching any to a reply.</text>
  <text x="40" y="780" class="muted">AUTHORED_ACTOR answer-key edges are excluded. A shared contact does not prove a shared person.</text>
</svg>
